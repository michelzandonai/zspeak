name: CI Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/ci-site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/ci-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Testes, dependências e build do site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
